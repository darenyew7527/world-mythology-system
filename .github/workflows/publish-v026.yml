name: Publish v0.26.0 sealed checkpoint

on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-v026.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-v026
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reassemble and verify sealed v0.26.0 source tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive=/tmp/world-mythology-v026-source.tar.gz
          : > "$archive"
          while IFS= read -r sha; do
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/blobs/$sha" \
              | jq -r '.content' | tr -d '\n' | base64 --decode >> "$archive"
          done <<'BLOB_SHAS'
          01623204889d0c4b988b6c977b70227c8ada88c1
          b08c709e87b179283b374c7efab8548fcacf0673
          dad3443a6cb60cda11a6fe8886f8e34698748f3d
          324f389f9049cf7258c7a0c04296cf94b05425aa
          f5658ad5860a61349f9400089c2e79b1b6b8a738
          ea315c74e0c74c868869227cfdbbd5d3d8795e52
          5cdd90e44490a93b57bbc63bf7f021664fef5ecc
          7d6a47223f52e8c0e8cec3ef6d40f9fadae67622
          b242cae0558f36eefa8659c0a24e4d9c8f08d8f8
          2198d548855f509353751282454ff70fe0f5328f
          4258bd41eeac63929ab593654dc21d2e758988cc
          572d9971b51c005d8a27f7a79eba0b321d162cd5
          9b3b27f0d26a592d31de295975eebb9073467448
          535faf525a2b11c143e761a42a9d04d6eded70dd
          241188a41719709e183c05319db647fa2eb87079
          372091ce6a62d3e87311b903e685d2ab9925311f
          c29a13abcdc99cce32dcaf6b384214aa95127815
          e06b547c9c6a1ab1fc4bb727375868e6ff503d17
          1203e47637e4137e83c8abb67a15f5d81790399c
          3d988c7e2177d6efc6a5f942cb355ee28d837baf
          707065c658fa62edf44a49680e70d59ac1442ea9
          35ebf95e15988d2d10661e708ae1bc541f9875e2
          362d0542ed2151aaf55845fab852990f8264780b
          bb7e5fb3cb7ca26c87cbe0fb27dc9bede639bd5e
          13aaa1427baacd0fd4e36dfde267ad6b57a7d67f
          BLOB_SHAS
          echo "4782ff59c14af2d39d693a1f69fc83070adc1b65ff5d915d5a536fbdfe8b2fdb  $archive" | sha256sum -c -
          mkdir -p /tmp/world-mythology-v026-source
          tar -xzf "$archive" -C /tmp/world-mythology-v026-source
          rsync -a --delete --exclude='.git/' /tmp/world-mythology-v026-source/ ./
          git add -A
          test "$(git write-tree)" = "f831e79941d0da3adb81f356f53294561c4eb06f"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify database, migrations, tests, privacy and production build
        run: |
          set -euo pipefail
          cp database/world_mythology.sqlite /tmp/world_mythology_v026_sealed.sqlite
          python3 -m unittest discover -s tests -v
          cp /tmp/world_mythology_v026_sealed.sqlite database/world_mythology.sqlite
          python3 scripts/validate_database.py
          python3 scripts/privacy_release_check.py
          python3 - <<'PY'
          import sqlite3
          con = sqlite3.connect('database/world_mythology.sqlite')
          assert con.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
          assert con.execute('PRAGMA foreign_key_check').fetchall() == []
          PY
          npm --prefix web ci
          npm --prefix web run build
          cp -a web/dist /tmp/world_mythology_v026_dist
          rsync -a --delete --exclude='.git/' /tmp/world-mythology-v026-source/ ./
          mkdir -p web/dist
          cp -a /tmp/world_mythology_v026_dist/. web/dist/
          git add -A
          test "$(git write-tree)" = "f831e79941d0da3adb81f356f53294561c4eb06f"

      - name: Publish main and v0.26.0 tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "发布 v0.26.0：故事地图与阅读路线 / Release v0.26.0 story maps and reading routes"
          git tag -a v0.26.0 -m "World Mythology System v0.26.0"
          git push origin HEAD:main refs/tags/v0.26.0

      - name: Build, verify and publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_dir=/tmp/world-mythology-v026-release
          mkdir -p "$release_dir"
          bundle="$release_dir/World_Mythology_System_v0.26.0_story_maps_reading_routes.git.bundle"
          sqlite="$release_dir/world_mythology_v0.26.0.sqlite"
          zip="$release_dir/World_Mythology_System_v0.26.0_20260830.zip"
          git bundle create "$bundle" --all
          cp database/world_mythology.sqlite "$sqlite"
          python3 scripts/build_release_package.py --output "$zip" --bundle "$bundle"
          git bundle verify "$bundle"
          unzip -t "$zip" >/dev/null
          echo "491d91845fb0e13fa88818f83add99bb67475b1e1f0bf752d5e61f2d67e92031  $sqlite" | sha256sum -c -
          sha256sum "$zip" "$bundle" "$sqlite"
          gh release create v0.26.0 "$zip" "$bundle" "$sqlite" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "World Mythology System v0.26.0 — Story Maps & Reading Routes" \
            --notes-file RELEASE_NOTES_v0.26.0.md

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify deployed v0.26.0 story snapshot
        run: |
          set -euo pipefail
          page_url="${{ steps.deployment.outputs.page_url }}"
          for attempt in $(seq 1 18); do
            if curl -fsSL "${page_url%/}/data/site-data.json" \
              | jq -e '.meta.projectVersion == "0.26.0-story-maps-reading-routes" and .meta.counts.stories == 23 and .meta.counts.storyVersions == 25 and .meta.counts.storyEventNodes == 77 and .meta.counts.readingRoutes == 6' >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          exit 1
