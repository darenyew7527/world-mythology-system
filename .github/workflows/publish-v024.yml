name: Publish v0.24.0 sealed checkpoint

on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-v024.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-v024
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reassemble and verify sealed source tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive=/tmp/world-mythology-v024-source.tar.gz
          : > "$archive"
          while IFS= read -r sha; do
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/blobs/$sha" \
              | jq -r '.content' | tr -d '\n' | base64 --decode >> "$archive"
          done <<'BLOB_SHAS'
          92876f64aa45a3e9165920b15fa4f380b921e469
