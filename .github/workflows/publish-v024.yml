          BLOB_SHAS
          echo "5ccb61af246e77b5c0ec0e09c7dd0877b848211a24e104d63047b702500d49b4  $archive" | sha256sum -c -
          mkdir -p /tmp/world-mythology-v024-source
          tar -xzf "$archive" -C /tmp/world-mythology-v024-source
          rsync -a --delete --exclude='.git/' /tmp/world-mythology-v024-source/ ./
          git add -A
          test "$(git write-tree)" = "b672d8ff277549ddfd470ff1068bbcd4c14ab312"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify database, tests, privacy and production build
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
          python3 scripts/privacy_release_check.py
          npm --prefix web ci
          npm --prefix web run build
          git add -A
          test "$(git write-tree)" = "b672d8ff277549ddfd470ff1068bbcd4c14ab312"

      - name: Publish main and v0.24.0 tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "发布 v0.24.0：Explorer 2.0 证据工作台 / Release v0.24.0 Explorer 2.0 evidence workbench"
          git tag -a v0.24.0 -m "World Mythology System v0.24.0"
          git push origin HEAD:main refs/tags/v0.24.0

      - name: Build and publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_dir=/tmp/world-mythology-v024-release
          mkdir -p "$release_dir"
          bundle="$release_dir/World_Mythology_System_v0.24.0_explorer2_evidence_workbench.git.bundle"
          sqlite="$release_dir/world_mythology_v0.24.0.sqlite"
          zip="$release_dir/World_Mythology_System_v0.24.0_20260828.zip"
          git bundle create "$bundle" --all
          cp database/world_mythology.sqlite "$sqlite"
          python3 scripts/build_release_package.py --output "$zip" --bundle "$bundle"
          gh release create v0.24.0 "$zip" "$bundle" "$sqlite" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "World Mythology System v0.24.0 — Explorer 2.0 Evidence Workbench" \
            --notes-file RELEASE_NOTES_v0.24.0.md

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
