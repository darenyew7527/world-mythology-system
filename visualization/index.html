<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>世界神话系统 · 关系图谱</title>
  <style>
    :root{color-scheme:dark;--bg:#06111c;--panel:#0b1d2d;--gold:#d8ab58;--blue:#5db9ff;--text:#e7edf3;--muted:#8294a6}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 30%,#12334e 0,#07131f 44%,#03080d 100%);font-family:Inter,system-ui,"Noto Sans SC",sans-serif;color:var(--text);min-height:100vh}
    header{padding:24px 28px 14px;border-bottom:1px solid #2f4e63;background:#07121dcc;backdrop-filter:blur(12px)}
    h1{margin:0;color:#f2cf83;font-family:serif;letter-spacing:.08em}p{margin:.5rem 0;color:var(--muted)}
    main{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:14px;padding:14px;height:calc(100vh - 104px)}
    aside,.stage{background:#071521d9;border:1px solid #294357;border-radius:14px;box-shadow:0 18px 70px #0008;overflow:hidden}
    aside{padding:16px;overflow:auto}.stage{position:relative}canvas{width:100%;height:100%;display:block}
    input,select{width:100%;margin:6px 0 14px;padding:10px;border:1px solid #35546a;background:#0d2233;color:var(--text);border-radius:8px}
    .metric{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #173044}.metric b{color:var(--gold)}
    #detail{margin-top:14px;padding:12px;background:#0b1d2d;border-radius:10px;line-height:1.5;font-size:.9rem}.tag{color:var(--blue)}
    @media(max-width:800px){main{grid-template-columns:1fr;height:auto}.stage{height:68vh}aside{order:2}}
  </style>
</head>
<body>
  <header><h1>世界神话系统</h1><p>证据可追踪 · 多文明 · 可持续扩张的关系图谱基础</p></header>
  <main>
    <aside>
      <label for="search">查找实体</label><input id="search" placeholder="Zeus / 奥丁 / 雷霆">
      <label for="type">类型过滤</label><select id="type"><option value="">全部类型</option></select>
      <div class="metric"><span>显示节点</span><b id="nodes">0</b></div>
      <div class="metric"><span>关系边</span><b id="edges">0</b></div>
      <div id="detail">点击节点查看当前基线身份。关系边来自 claim；反向关系由数据库动态推导。</div>
    </aside>
    <section class="stage"><canvas id="graph"></canvas></section>
  </main>
  <script src="graph-data.js"></script>
  <script>
  (()=>{const data=window.MYTH_GRAPH||{nodes:[],edges:[]},canvas=document.querySelector('#graph'),ctx=canvas.getContext('2d'),search=document.querySelector('#search'),type=document.querySelector('#type'),detail=document.querySelector('#detail');let nodes=[],edges=[],hover=null;
    [...new Set(data.nodes.map(n=>n.primary_type))].sort().forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;type.append(o)});
    function resize(){const r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);render()}
    function rebuild(){const q=search.value.trim().toLocaleLowerCase(),wanted=type.value;nodes=data.nodes.filter(n=>(!wanted||n.primary_type===wanted)&&(!q||(n.canonical_name+' '+(n.name_zh||'')+' '+n.id).toLocaleLowerCase().includes(q))).slice(0,110);const ids=new Set(nodes.map(n=>n.id));edges=data.edges.filter(e=>ids.has(e.source_entity_id)&&ids.has(e.target_entity_id));const r=canvas.getBoundingClientRect(),cx=r.width/2,cy=r.height/2,rad=Math.min(r.width,r.height)*.38;nodes.forEach((n,i)=>{const a=(i/nodes.length)*Math.PI*2+(i%7)*.09;n.x=cx+Math.cos(a)*rad*(.45+(i%5)/8);n.y=cy+Math.sin(a)*rad*(.45+(i%5)/8)});document.querySelector('#nodes').textContent=nodes.length;document.querySelector('#edges').textContent=edges.length;render()}
    function render(){const r=canvas.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);ctx.strokeStyle='#274b64';ctx.lineWidth=.8;const map=new Map(nodes.map(n=>[n.id,n]));edges.forEach(e=>{const a=map.get(e.source_entity_id),b=map.get(e.target_entity_id);if(!a||!b)return;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()});nodes.forEach(n=>{const active=n===hover;ctx.beginPath();ctx.arc(n.x,n.y,active?7:4.2,0,Math.PI*2);ctx.fillStyle=active?'#ffd47b':n.evidence_status==='SOURCE_BACKED'?'#5db9ff':'#9b7650';ctx.fill();if(active){ctx.fillStyle='#e7edf3';ctx.font='12px system-ui';ctx.fillText(n.name_zh||n.canonical_name,n.x+10,n.y+4)}})}
    canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;hover=nodes.find(n=>(n.x-x)**2+(n.y-y)**2<90)||null;canvas.style.cursor=hover?'pointer':'default';render()});canvas.addEventListener('click',()=>{if(!hover)return;detail.innerHTML=`<b>${hover.name_zh||hover.canonical_name}</b><br>${hover.canonical_name}<br><span class="tag">${hover.primary_type}</span><br><code>${hover.id}</code><br>证据状态：${hover.evidence_status}`});search.addEventListener('input',rebuild);type.addEventListener('change',rebuild);addEventListener('resize',resize);resize();rebuild();})();
  </script>
</body>
</html>
